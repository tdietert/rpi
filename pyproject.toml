[project]
name = "rpi"
version = "0.1.0"
description = "Review-Plan-Implement-Fix automation for the Claude CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "rich>=13.0"]

[project.scripts]
rpi = "rpi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
