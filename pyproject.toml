[project]
name = "rpi"
version = "0.1.0"
description = "Review-Plan-Implement-Fix automation for the Claude CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "prompt-toolkit>=3.0", "rich>=13.0"]

[project.scripts]
rpi = "rpi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E501", "SIM105", "SIM108"]
